<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu sesión — Vita</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #F7EFE4; color: #3A4F2A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  .pantalla { max-width: 460px; margin: 0 auto; padding: 48px 20px 64px; }
  .marca { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin-bottom: 26px; }
  h1 { font-size: 1.35rem; line-height: 1.3; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .campo {
    width: 100%; padding: .7rem .8rem; border-radius: 10px; font-size: 1rem;
    font-family: inherit; color: inherit; background: transparent;
    border: 1px solid rgba(58,79,42,.28); margin-bottom: 10px;
  }
  .codigo { letter-spacing: .35em; text-align: center; font-size: 1.25rem; }
  .cta {
    display: block; width: 100%; padding: .85rem 1rem; border: 0; border-radius: 12px;
    background: #C1694F; color: #FFF6EC; font-size: 1rem; font-weight: 700;
    font-family: inherit; text-align: center; cursor: pointer;
  }
  .cta[disabled] { opacity: .5; cursor: default; }
  .error { font-size: .85rem; color: #B3392E; margin: 0 0 10px; }
  .ayuda { font-size: .87rem; opacity: .72; }

  /* La sala ocupa todo: una videollamada con márgenes de cortesía es una
     videollamada más chica, y acá lo único que importa es verse la cara. */
  #sala { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; display: none; }
  body.en-sala { background: #1A1C16; }

  /* El aviso de presencia (T&C §9.5). Va ENCIMA de la videollamada y arriba,
     donde no tapa las caras ni los controles de Daily, que viven abajo.
     `pointer-events:none` para que nunca se coma un click de la llamada: es
     información, no un control. */
  #aviso {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    margin: 0; padding: 12px 16px;
    background: rgba(26,28,22,.92); color: #F7EFE4;
    font-size: .92rem; line-height: 1.45; text-align: center;
    pointer-events: none;
  }

  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    body { background: #1A1C16; color: #E4E0D2; }
    .campo { border-color: rgba(228,224,210,.28); }
  }
</style>
<!-- El token de Turnstile para el pedido de código. Ver /captcha.js. -->
<script src="/captcha.js"></script>
</head>
<body>

<iframe id="sala" allow="camera; microphone; fullscreen; speaker; display-capture; autoplay"></iframe>
<p id="aviso" hidden></p>

<div class="pantalla" id="ui">
  <p class="marca">Vita</p>

  <div id="cargando"><p>Preparando tu sesión…</p></div>

  <div id="identificar" hidden>
    <h1>Confirmá que sos vos</h1>
    <p class="ayuda">Te mandamos un código al mail con el que reservaste. Es por única vez en este dispositivo.</p>
    <div id="pasoMail">
      <input class="campo" id="mail" type="email" inputmode="email" autocomplete="email" placeholder="tu@mail.com" spellcheck="false">
      <p class="error" id="errorMail" hidden></p>
      <button class="cta" id="btnCodigo">Enviarme el código</button>
    </div>
    <div id="pasoCodigo" hidden>
      <input class="campo codigo" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="······">
      <p class="error" id="errorCodigo" hidden></p>
      <button class="cta" id="btnConfirmar">Entrar</button>
    </div>
  </div>

  <div id="temprano" hidden>
    <h1 id="tempranoTitulo">Todavía no es la hora</h1>
    <p id="tempranoDetalle"></p>
    <!-- La línea de arriba ya dice cuándo abre (la manda el servidor); esta
         explica por qué y qué hacer, sin repetir "la sala se abre". -->
    <p class="ayuda" id="tempranoAyuda">Se abre <b>15 minutos antes</b> de la sesión. A esa hora, volvé a entrar con este mismo link.</p>
  </div>

  <div id="problema" hidden>
    <h1 id="problemaTitulo">No pudimos abrir la sesión</h1>
    <p id="problemaDetalle" class="ayuda"></p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ggygiihhnkjrerpinhha.supabase.co';
// Pública por diseño — ver el comentario largo en `/c/<slug>`.
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdneWdpaWhobmtqcmVycGluaGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1Mjc5NjEsImV4cCI6MjA5NzEwMzk2MX0.lHPjyKjJIYD_lUTCF7uMBCKj9tCK_67OyrIFkCLQ-BI';

const $ = (id) => document.getElementById(id);
const ver = (id) => { $(id).hidden = false; };
const ocultar = (id) => { $(id).hidden = true; };
const bookingId = new URLSearchParams(location.search).get('booking');

// 🔴 La sesión guardada sirve para el mismo rato, no para el día de la sesión:
// el token de acceso de Supabase dura una hora y acá no se guarda el de
// refresco. O sea que quien entre desde el mail dos días después SIEMPRE va a
// tener que confirmar su mail de nuevo. No es un caso raro: es el normal, y por
// eso la pantalla de código está pensada como parte del camino y no como un
// error.
const CLAVE_SESION = 'vita_sesion_web';
function leerSesion() { try { return JSON.parse(sessionStorage.getItem(CLAVE_SESION) || 'null'); } catch { return null; } }
function guardarSesion(s) { try { sessionStorage.setItem(CLAVE_SESION, JSON.stringify(s)); } catch (e) {} }

function mostrarError(id, msg) { const el = $(id); el.textContent = msg; el.hidden = !msg; }

function problema(titulo, detalle) {
  ocultar('cargando'); ocultar('identificar'); ocultar('temprano');
  $('problemaTitulo').textContent = titulo;
  $('problemaDetalle').textContent = detalle || '';
  ver('problema');
}

// ── Presencia ───────────────────────────────────────────────────────────────
//
// 🔴 POR QUÉ: hasta el 13/09/2026 la sala era un `<iframe>` pelado con `src`, o
// sea que **la página no sabía quién estaba adentro**. Quien esperaba solo veía
// una pantalla negra y no podía distinguir "el coach no vino" de "se me colgó el
// wifi" — y esa distinción es lo único que necesita en ese momento. Con
// `DailyIframe.wrap()` el mismo iframe pasa a emitir `participant-joined` /
// `participant-left`, sin webhook ni backend.
//
// ⚠️ REGLA DURA: esto es una MEJORA, nunca una condición para entrar. Si el
// script de Daily no carga, se cae al `src` de siempre y la sesión funciona
// igual sin avisos. Mismo criterio de fallar-abierto que `web/captcha.js`.
//
// Los plazos son los de T&C §9.5 y NO son simétricos (ver docs/no-show.md):
// el coach tiene 10 minutos para aparecer, el cliente 20 para llegar.
// ⚠️ Versión y archivo VERIFICADOS contra el CDN el 13/09/2026, no elegidos de
// memoria: `package.json@0.92.2` declara `module: dist/daily-esm.js` (el nombre
// `daily-iframe-esm.js` es el legacy), el bundle trae **un** export `as default`
// y expone `key:"wrap"`. Las tres cosas que este código usa.
// 📌 Pineado a una versión exacta a propósito: `@latest` cambiaría la sala en
// vivo sin que nadie lo decida, y acá adentro pasa una sesión de acompañamiento.
const DAILY_JS = 'https://unpkg.com/@daily-co/daily-js@0.92.2/dist/daily-esm.js';
const MIN_AVISO       = 2;   // "todavía no llegó nadie" — que sepa que no es su conexión
const MIN_CLIENTE_VA  = 10;  // el cliente puede irse sin perder nada
const MIN_COACH_VA    = 20;  // el coach ya cumplió y cobra igual

let esCoach = false, empiezaMs = null, otroPresente = false, avisoTimer = null;

/** Minutos desde el HORARIO AGENDADO (no desde que entré). Negativo = temprano. */
function minutosDesdeElHorario() {
  if (!empiezaMs) return null;
  return (Date.now() - empiezaMs) / 60000;
}

function pintarAviso(texto) {
  const el = $('aviso');
  if (!texto) { el.hidden = true; return; }
  el.textContent = texto;
  el.hidden = false;
}

/** Decide qué decir. Se llama por timer y ante cada cambio de presencia. */
function revisarPresencia() {
  if (otroPresente) return pintarAviso('');          // llegó: nada que decir
  const m = minutosDesdeElHorario();
  if (m == null || m < MIN_AVISO) return pintarAviso('');

  if (esCoach) {
    // 📌 Al coach NO se le dice nada hasta que venció SU espera: antes de los 20
    // todavía está obligado a estar, y un cartel a los 2 minutos lo invitaría a
    // irse justo cuando la regla le pide quedarse.
    if (m >= MIN_COACH_VA) {
      pintarAviso('No llegó nadie. Podés cerrar: esta sesión se te paga igual.');
    }
    return;
  }

  if (m >= MIN_CLIENTE_VA) {
    // ⚠️ No se promete un monto porque la página no lo tiene — inventarlo sería
    // peor que no decirlo. Cuando `create-meeting-room` devuelva el importe, acá
    // va "te devolvemos $X en hasta N días" (ver docs/no-show.md).
    pintarAviso('Tu coach no llegó. Podés irte: no se te cobra esta sesión.');
  } else {
    pintarAviso('Todavía no llegó nadie. No es tu conexión — te avisamos acá.');
  }
}

function seguirPresencia(frame) {
  const recontar = () => {
    // El "otro" es cualquier participante que no sea uno mismo.
    try { otroPresente = Object.keys(frame.participants() || {}).some(k => k !== 'local'); }
    catch { otroPresente = false; }
    revisarPresencia();
  };
  frame.on('joined-meeting', recontar)
       .on('participant-joined', recontar)
       .on('participant-left', recontar);
  clearInterval(avisoTimer);
  avisoTimer = setInterval(revisarPresencia, 20000);  // por si nadie entra nunca
  revisarPresencia();
}

/** Abre la sala adentro de la página. Daily funciona en el navegador sin
 *  instalar nada — que es exactamente lo que hace falta acá. */
async function entrar(url) {
  $('ui').hidden = true;
  document.body.classList.add('en-sala');
  const f = $('sala');
  f.style.display = 'block';

  try {
    const { default: DailyIframe } = await import(DAILY_JS);
    const frame = DailyIframe.wrap(f, { showLeaveButton: true });
    seguirPresencia(frame);
    await frame.join({ url });
  } catch (e) {
    // Falla abierto: la videollamada vale más que el aviso.
    console.error('[sala] sin presencia, entro derecho:', e);
    pintarAviso('');
    f.src = url;
  }
}

async function intentarEntrar() {
  const sesion = leerSesion();
  if (!sesion?.access_token) return pedirIdentificacion();

  let r, cuerpo;
  try {
    r = await fetch(`${SUPABASE_URL}/functions/v1/create-meeting-room`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${sesion.access_token}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ booking_id: bookingId }),
    });
    cuerpo = await r.json().catch(() => ({}));
  } catch (e) {
    console.error('[sala]', e);
    return problema('No pudimos abrir la sesión', 'Revisá tu conexión y volvé a intentar.');
  }

  if (r.ok && cuerpo?.url) {
    // 📌 Los dos campos que `create-meeting-room` empezó a devolver el 13/09.
    // Si vinieran vacíos —una versión vieja de la función todavía deployada—,
    // `esCoach` queda en false y `empiezaMs` en null: los avisos no salen y la
    // sesión entra igual. Degradar en silencio es correcto acá.
    esCoach = cuerpo.es_coach === true;
    const t = Date.parse(cuerpo.empieza ?? '');
    empiezaMs = Number.isFinite(t) ? t : null;
    return entrar(cuerpo.url);
  }

  // 401 es el caso NORMAL, no un error: el token venció. Se pide el código.
  if (r.status === 401) return pedirIdentificacion();
  if (r.status === 403) {
    return problema('Esta no es tu sesión',
      'Puede que hayas entrado con otro mail. Volvé a intentar con el mail con el que reservaste.');
  }
  if (r.status === 404) {
    return problema('No encontramos esta sesión', 'Puede que el enlace esté incompleto.');
  }
  // 🔴 Fuera de horario llega con 200 y SIN `url` (ver `create-meeting-room`):
  // hasta el 11/09 la función devolvía el link a cualquier hora, y quien llegaba
  // temprano caía en la pantalla de Daily en inglés. Y 422 = fecha ilegible.
  const terminada = cuerpo?.estado === 'terminada';
  $('tempranoTitulo').textContent = terminada ? 'La sesión terminó' : 'Todavía no es la hora';
  $('tempranoAyuda').hidden = terminada;
  ocultar('cargando');
  $('tempranoDetalle').textContent = cuerpo?.error
    ? String(cuerpo.error)
    : 'La sala todavía no está abierta.';
  ver('temprano');
}

function pedirIdentificacion() {
  ocultar('cargando');
  ver('identificar');
  $('mail').focus();
}

async function pedirCodigo() {
  const mail = $('mail').value.trim().toLowerCase();
  mostrarError('errorMail', '');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) {
    return mostrarError('errorMail', 'Revisá el mail: parece que falta algo.');
  }
  $('btnCodigo').disabled = true; $('btnCodigo').textContent = 'Enviando…';
  try {
    // ⚠️ `create_user: false`: acá la cuenta YA existe (reservó). Sin esto, un
    // mail mal tipeado crearía una cuenta nueva y la persona quedaría mirando
    // una sesión que no es suya.
    // 🔴 Con el CAPTCHA de Supabase prendido, este endpoint rechaza el pedido
    // sin token. Ver `web/captcha.js`. Si el script no cargó, sale sin token y
    // decide el servidor.
    const captchaToken = await window.pedirCaptchaToken?.();
    const r = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: mail,
        create_user: false,
        gotrue_meta_security: { captcha_token: captchaToken },
      }),
    });
    if (!r.ok) {
      return mostrarError('errorMail', r.status === 429
        ? 'Ya te mandamos uno recién. Esperá un minuto.'
        : 'No pudimos mandar el código. ¿Es el mail con el que reservaste?');
    }
    ocultar('pasoMail'); ver('pasoCodigo'); $('codigo').focus();
  } finally {
    $('btnCodigo').disabled = false; $('btnCodigo').textContent = 'Enviarme el código';
  }
}

async function confirmarCodigo() {
  const mail = $('mail').value.trim().toLowerCase();
  const token = $('codigo').value.replace(/\D/g, '');
  mostrarError('errorCodigo', '');
  if (!token) return mostrarError('errorCodigo', 'Escribí el código que te llegó.');

  $('btnConfirmar').disabled = true; $('btnConfirmar').textContent = 'Entrando…';
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/verify`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: mail, token, type: 'email' }),
    });
    const cuerpo = await r.json().catch(() => ({}));
    if (!r.ok || !cuerpo?.access_token) {
      return mostrarError('errorCodigo', r.status === 429
        ? 'Probaste varias veces seguidas. Esperá un momento.'
        : 'Ese código no coincide, o ya venció.');
    }
    guardarSesion({ access_token: cuerpo.access_token, email: mail });
    ocultar('identificar'); ver('cargando');
    await intentarEntrar();
  } finally {
    $('btnConfirmar').disabled = false; $('btnConfirmar').textContent = 'Entrar';
  }
}

$('btnCodigo').addEventListener('click', pedirCodigo);
$('btnConfirmar').addEventListener('click', confirmarCodigo);

if (!bookingId) {
  problema('Falta el enlace de la sesión', 'Abrí el link que te mandamos por mail.');
} else {
  intentarEntrar();
}
</script>
</body>
</html>
