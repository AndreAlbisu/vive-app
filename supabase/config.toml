# Config del CLI de Supabase.
# ⚠️ Reemplazá TU_PROJECT_REF por tu project ref real (el mismo de
#    `supabase link --project-ref <ref>`). Si ya tenías un config.toml local,
#    NO uses este: copiá solo los bloques [functions.*] de abajo al tuyo.
project_id = "TU_PROJECT_REF"

# ── Edge functions ───────────────────────────────────────────────────────────
# Las llamadas por MercadoPago (redirect del OAuth y webhook) NO traen JWT de
# Supabase → hay que desactivar la verificación de JWT del gateway, si no las
# rechaza con 401 y el flujo falla en silencio. Su seguridad la da el state
# firmado (OAuth) y la firma x-signature (webhook), no el JWT.
#
# Las otras 3 functions (mp-oauth-start, mp-create-payment, mp-process-refunds)
# usan el default verify_jwt = true (las llama la app/cron con credencial válida).

[functions.mp-oauth-callback]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

[functions.booking-return]
verify_jwt = false

# PayPal tampoco manda JWT de Supabase. Su seguridad la da la verificación de
# firma contra la API de PayPal (`/v1/notifications/verify-webhook-signature`),
# no el JWT del gateway. La función es fail-closed: sin PAYPAL_WEBHOOK_ID
# rechaza con 503 en vez de procesar sin verificar.
[functions.paypal-webhook]
verify_jwt = false
